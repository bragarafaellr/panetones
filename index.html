<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panetones do Rogerio</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icone.png" type="image/png">
<link rel="apple-touch-icon" href="icone.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Panetones do Rogerio</h1>
  <p id="sub">Panetones caseiros. Todo o lucro vai para a CUFA (Central Única das Favelas). Pedidos até 19/12.</p>

  <div class="galeria">
    <img src="fotos/1.jpg" width="666" height="1000" alt="Panetone de chocolate visto de lado" loading="lazy">
    <img src="fotos/2.jpg" width="1000" height="666" alt="Panetone visto de cima" loading="lazy">
    <img src="fotos/3.jpg" width="666" height="1000" alt="Menina sorrindo com um pedaço de panetone" loading="lazy">
    <img src="fotos/4.jpg" width="666" height="1000" alt="Menina mordendo um pedaço de panetone" loading="lazy">
    <img src="fotos/5.jpg" width="666" height="1000" alt="Menina comendo panetone" loading="lazy">
    <img src="fotos/6.jpg" width="666" height="1000" alt="Homem mordendo um pedaço de panetone" loading="lazy">
    <img src="fotos/7.jpg" width="666" height="1000" alt="Panetone de chocolate aberto" loading="lazy">
    <img src="fotos/8.jpg" width="666" height="1000" alt="Panetone de chocolate aberto, por dentro" loading="lazy">
    <img src="fotos/9.jpg" width="750" height="1000" alt="Panetone embrulhado para presente com laço vermelho" loading="lazy">
    <img src="fotos/10.jpg" width="750" height="1000" alt="Panetones de goiabada recém-assados" loading="lazy">
    <img src="fotos/11.jpg" width="750" height="1000" alt="Massa de panetone com gotas de chocolate antes de assar" loading="lazy">
    <img src="fotos/12.jpg" width="750" height="1000" alt="Panetone de chocolate partido ao meio" loading="lazy">
    <img src="fotos/13.jpg" width="750" height="1000" alt="Panetone de goiabada aberto" loading="lazy">
    <img src="fotos/14.jpg" width="750" height="1000" alt="Pedaço de panetone com goiabada" loading="lazy">
  </div>

  <div id="loja">
    <div id="produtos"></div>

    <form id="form" class="card" hidden>
      <h2>Seus dados</h2>
      <label for="nome">Nome</label>
      <input id="nome" required autocomplete="name">
      <label for="whatsapp">WhatsApp</label>
      <input id="whatsapp" required inputmode="tel" autocomplete="tel" placeholder="(11) 91234-5678">
      <label for="obs">Observações (opcional)</label>
      <textarea id="obs" rows="2"></textarea>
      <p id="erro" class="erro" role="alert"></p>
    </form>
  </div>

  <div id="pagamento" class="card" hidden>
    <h2>Pedido <span id="pedidoId"></span></h2>
    <div id="resumo"></div>
    <p><strong>Total: <span id="pedidoTotal"></span></strong></p>
    <p>Pague com PIX:</p>
    <div id="qr" class="qr"></div>
    <button class="principal" id="copiar">Copiar código PIX</button>
    <a class="principal" id="comprovante" target="_blank" rel="noopener">Enviar comprovante no WhatsApp</a>
  </div>
</main>

<div class="rodape" id="rodape">
  <div><strong id="total">R$ 0,00</strong><button class="principal" id="continuar" disabled>Continuar</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="pix.js"></script>
<script>
const $ = id => document.getElementById(id);
const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const qtd = {}; // 'id|tamanho' -> quantidade; 'id|500g|lata' -> quantos desses vão em lata

// Galeria passa sozinha; pausa alguns segundos depois de um toque
const galeria = document.querySelector('.galeria');
let tocouEm = 0;
galeria.addEventListener('pointerdown', () => tocouEm = Date.now());
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(() => {
  if (Date.now() - tocouEm < 6000) return;
  const fotos = [...galeria.children], inicio = fotos[0].offsetLeft;
  const fim = galeria.scrollLeft + galeria.clientWidth >= galeria.scrollWidth - 2;
  const prox = fim ? fotos[0] : fotos.find(f => f.offsetLeft - inicio > galeria.scrollLeft + 2);
  galeria.scrollTo({ left: prox.offsetLeft - inicio, behavior: 'smooth' });
}, 3000);

function itensDoPedido() {
  return Object.entries(qtd).filter(([k, q]) => q > 0 && !k.endsWith('|lata')).map(([k, q]) => {
    const [id, tamanho] = k.split('|');
    const latas = qtd[k + '|lata'] || 0;
    return latas ? { id, tamanho, qtd: q, latas } : { id, tamanho, qtd: q };
  });
}
const preco = i => CONFIG.produtos.find(p => p.id === i.id).precos[i.tamanho];
const nomeItem = i => `${CONFIG.produtos.find(p => p.id === i.id).nome} ${i.tamanho.replace('g', ' g')}${i.latas ? ` (${i.latas} em lata)` : ''}`;
const precoItem = i => preco(i) * i.qtd + (i.latas || 0) * CONFIG.lata;

if (Date.now() > new Date(CONFIG.dataLimite)) {
  $('sub').textContent = 'Pedidos encerrados';
  $('loja').hidden = $('rodape').hidden = true;
} else {
  $('produtos').innerHTML = CONFIG.produtos.map(p => `
    <div class="card"><h2>${p.nome}</h2>
      ${Object.entries(p.precos).map(([t, v]) => `
        <div class="linha"><span>${t.replace('g', ' g')} · ${brl(v)}</span>
          <span class="stepper">
            <button type="button" data-k="${p.id}|${t}" data-d="-1" aria-label="Menos ${p.nome} ${t}">−</button>
            <span id="q-${p.id}|${t}">0</span>
            <button type="button" data-k="${p.id}|${t}" data-d="1" aria-label="Mais ${p.nome} ${t}">+</button>
          </span></div>${t === '500g' ? `
        <div class="linha lata"><span>↳ em lata (embalagem especial) · + ${brl(CONFIG.lata)}</span>
          <span class="stepper">
            <button type="button" data-k="${p.id}|500g|lata" data-d="-1" aria-label="Menos lata ${p.nome} 500g">−</button>
            <span id="q-${p.id}|500g|lata">0</span>
            <button type="button" data-k="${p.id}|500g|lata" data-d="1" aria-label="Mais lata ${p.nome} 500g">+</button>
          </span></div>` : ''}`).join('')}
    </div>`).join('');
}

$('produtos').onclick = e => {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  const k = b.dataset.k;
  qtd[k] = Math.max(0, (qtd[k] || 0) + Number(b.dataset.d));
  // No máximo uma lata por panetone de 500 g daquele sabor
  const base = k.replace('|lata', ''), lata = base + '|lata';
  if (qtd[lata] > (qtd[base] || 0)) qtd[lata] = qtd[base] || 0;
  [base, lata].forEach(x => { const el = $('q-' + x); if (el) el.textContent = qtd[x] || 0; });
  const total = itensDoPedido().reduce((s, i) => s + precoItem(i), 0);
  $('total').textContent = brl(total);
  $('continuar').disabled = total === 0;
};

$('continuar').onclick = () => {
  if (!$('form').hidden) return $('form').requestSubmit();
  $('form').hidden = false;
  $('continuar').textContent = 'Enviar pedido';
  $('nome').focus();
  $('form').scrollIntoView();
};

$('whatsapp').oninput = e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 11)
    .replace(/^(\d{2})(\d)/, '($1) $2').replace(/(\d)(\d{4})$/, '$1-$2');
};

$('form').onsubmit = async e => {
  e.preventDefault();
  const whatsapp = $('whatsapp').value.replace(/\D/g, '');
  if (whatsapp.length < 10) return $('erro').textContent = 'WhatsApp inválido';
  const itens = itensDoPedido();
  if (!itens.length) return $('erro').textContent = 'Escolha ao menos um panetone';
  $('continuar').disabled = true;
  $('erro').textContent = '';
  try {
    const r = await fetch(CONFIG.apiUrl, { method: 'POST', body: JSON.stringify({ acao: 'criar', nome: $('nome').value, whatsapp, itens, obs: $('obs').value }) }).then(r => r.json());
    if (r.erro) throw new Error(r.erro);
    mostrarPagamento(r.id, r.total, itens);
  } catch (err) {
    $('erro').textContent = 'Não foi possível enviar: ' + err.message;
    $('continuar').disabled = false;
  }
};

function mostrarPagamento(id, total, itens) {
  $('loja').hidden = $('rodape').hidden = true;
  $('pagamento').hidden = false;
  $('pedidoId').textContent = id;
  $('pedidoTotal').textContent = brl(total);
  $('resumo').innerHTML = itens.map(i => `<div class="linha"><span>${i.qtd}× ${nomeItem(i)}</span><span>${brl(precoItem(i))}</span></div>`).join('');
  $('comprovante').href = `https://wa.me/${CONFIG.whatsappComprovante}?text=${encodeURIComponent('Comprovante do pedido ' + id)}`;
  if (CONFIG.pix.chave === 'TODO_CHAVE_PIX') {
    $('qr').classList.add('vazio');
    $('qr').textContent = 'QR code PIX em breve';
    $('copiar').hidden = true;
  } else {
    const codigo = gerarPix({ ...CONFIG.pix, valor: total, txid: id });
    const qr = qrcode(0, 'M');
    qr.addData(codigo);
    qr.make();
    $('qr').innerHTML = qr.createSvgTag({ scalable: true, margin: 8, alt: 'QR code PIX' });
    $('copiar').onclick = () => navigator.clipboard.writeText(codigo).then(() => $('copiar').textContent = 'Código copiado!');
  }
  scrollTo(0, 0);
}
</script>
</body>
</html>
