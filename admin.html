<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel de Pedidos</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icone.png" type="image/png">
<link rel="apple-touch-icon" href="icone.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Pedidos</h1>
  <p id="erro" class="erro" role="alert"></p>

  <form id="login" class="card" hidden>
    <label for="senha">Senha</label>
    <input id="senha" type="password" required autocomplete="current-password">
    <button class="principal">Entrar</button>
  </form>

  <div id="painel" hidden>
    <div class="acoes"><button id="atualizar">Atualizar</button><button id="sair">Sair</button></div>
    <section id="prontos" class="card" hidden></section>
    <section id="proxima" class="card"></section>
    <form id="fornada" class="card">
      <h2>Saiu da fornada</h2>
      <p class="muted">Preencha só o que saiu.</p>
      <table id="fItens"></table>
      <button class="principal" id="fEnviar">Registrar e ver para quem vai</button>
      <div id="fResultado" role="status"></div>
    </form>
    <details id="historico" class="card"><summary id="hResumo">Fornadas registradas</summary><div id="hLista"></div></details>
    <div class="card" id="totais"></div>
    <label for="filtro">Mostrar</label>
    <select id="filtro">
      <option value="">Todos</option>
      <option value="fila">Próximos da fila</option>
      <option>Fazendo</option><option>Pronto pra entrega</option>
      <hr>
      <option value="cobrar">Falta cobrar</option>
      <option value="espera">Na espera</option>
      <option>Entregue</option>
      <hr>
      <option>Cancelado</option>
      <option value="Apagado">Apagados</option>
    </select>
    <div id="lista"></div>
  </div>
</main>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const produto = id => CONFIG.produtos.find(p => p.id === id) || { nome: id };
const nomeItem = (id, tamanho) => `${esc(produto(id).nome)} ${esc(tamanho.replace('g', ' g'))}`;
const ativo = p => !['Apagado', 'Cancelado', 'Entregue'].includes(p.etapa);
const naFila = p => ativo(p) && !p.espera; // na espera: entrega mais para frente, fora das fornadas
const conta = p => p.etapa !== 'Cancelado' && p.etapa !== 'Apagado'; // entra nos totais de dinheiro
let pedidos = [], fornadas = [];
const pronto = (p, i) => Math.min(i.qtd, p.prontos[i.id + '|' + i.tamanho] || 0);
const whats = p => `<a href="https://wa.me/55${esc(p.whatsapp.replace(/\D/g, ''))}" target="_blank" rel="noopener">WhatsApp</a>`;
// Pedido pela metade: o que já saiu fica apagado, o que falta fica em destaque
const itensHtml = p => p.itens.map(i => {
  const ok = pronto(p, i), falta = i.qtd - ok, nome = `${i.qtd}× ${nomeItem(i.id, i.tamanho)}${i.latas ? ` (${i.latas} em lata)` : ''}`;
  if (p.etapa !== 'Fazendo') return nome;
  if (!falta) return `<span class="item-ok">✓ ${nome} pronto</span>`;
  return `<span class="item-falta">${nome}: falta ${falta}</span>${ok ? ` <span class="item-ok">(${ok} pronto)</span>` : ''}`;
}).join('<br>');

const api = d => fetch(CONFIG.apiUrl, { method: 'POST', body: JSON.stringify({ ...d, token: localStorage.getItem('token') }) }).then(r => r.json());

async function carregar() {
  $('erro').textContent = '';
  $('atualizar').disabled = true;
  $('atualizar').textContent = 'Atualizando…';
  try {
    const r = await api({ acao: 'listar' });
    if (r.erro === 'Não autorizado') { sair(); return $('erro').textContent = 'Senha incorreta'; }
    if (r.erro) throw new Error(r.erro);
    pedidos = r.pedidos;
    fornadas = r.fornadas || [];
    $('login').hidden = true;
    $('painel').hidden = false;
    render();
  } catch (err) { $('erro').textContent = 'Erro: ' + err.message; }
  finally { $('atualizar').disabled = false; $('atualizar').textContent = 'Atualizar'; }
}

function render() {
  const prontos = pedidos.filter(p => p.etapa === 'Pronto pra entrega' && !p.espera);
  $('prontos').hidden = !prontos.length;
  $('prontos').innerHTML = `<h2>Prontos para entregar (${prontos.length})</h2>` + prontos.map(p => `
    <div class="bloco">
      <div class="linha"><strong>${esc(p.id)} · ${esc(p.nome)}</strong>${p.pago ? '<span>Pago</span>' : '<strong class="erro">Não pago</strong>'}</div>
      <div>${itensHtml(p)}</div>
      <div class="acoes"><button data-id="${esc(p.id)}" data-acao="status" data-v="Entregue">Entregue</button>${whats(p)}</div>
    </div>`).join('');

  // Próxima fornada: tudo o que falta, por sabor e tamanho, na ordem de chegada dos pedidos
  const sugestao = new Map();
  pedidos.filter(naFila).forEach(p => p.itens.forEach(i => {
    const falta = i.qtd - pronto(p, i), k = i.id + '|' + i.tamanho;
    if (falta <= 0) return;
    if (!sugestao.has(k)) sugestao.set(k, { id: i.id, tamanho: i.tamanho, qtd: 0, pedidos: [] });
    const s = sugestao.get(k);
    s.qtd += falta;
    s.pedidos.push(`${esc(p.id)} ${esc(p.nome)} (${falta})`);
  }));
  $('proxima').innerHTML = '<h2>Próxima fornada</h2>' + (sugestao.size
    ? [...sugestao.values()].map(s => `<p><strong>${s.qtd}× ${nomeItem(s.id, s.tamanho)}</strong><br><span class="muted">${s.pedidos.join(' · ')}</span></p>`).join('') +
      '<div class="acoes"><button type="button" id="preencher">Preencher fornada com esta sugestão</button></div>'
    : '<p class="muted">Nada faltando: todos os pedidos já estão prontos.</p>');
  if (sugestao.size) $('preencher').onclick = () => {
    $('fItens').querySelectorAll('input').forEach(c => c.value = (sugestao.get(c.dataset.id + '|' + c.dataset.tamanho) || {}).qtd || '');
    $('fornada').scrollIntoView({ behavior: 'smooth' });
  };

  // Fornadas: itens registrados juntos (mesmo lote), mais recente primeiro
  const lotes = new Map();
  fornadas.forEach(f => lotes.set(f.lote, [...(lotes.get(f.lote) || []), f]));
  const historico = [...lotes.values()].reverse();
  $('hResumo').textContent = `Fornadas registradas (${historico.length})`;
  $('hLista').innerHTML = historico.map(fs => {
    const cancelada = fs.every(f => f.status === 'Cancelada');
    return `<div class="bloco${cancelada ? ' cancelada' : ''}">
      <div class="muted">${new Date(fs[0].registradoEm).toLocaleString('pt-BR')}${cancelada ? ' · Cancelada' : ''}</div>
      ${fs.map(f => `<div><strong>${f.qtd}× ${nomeItem(f.id, f.tamanho)}</strong> → ${f.destinos.map(d => `${esc(d.id)} ${esc(d.nome)} (${d.qtd})`).join(' · ') || 'nenhum pedido'}${f.sobra ? ` · sobrou ${f.sobra}` : ''}</div>`).join('')}
      ${cancelada ? '' : `<div class="acoes"><button data-acao="cancelarFornada" data-lote="${esc(fs[0].lote)}">Cancelar fornada</button></div>`}
    </div>`;
  }).join('') || '<p class="muted">Nenhuma fornada registrada ainda.</p>';

  const soma = cond => pedidos.filter(p => conta(p) && cond(p)).reduce((s, p) => s + Number(p.total), 0);
  $('totais').innerHTML = `<p>Recebido: <strong>${brl(soma(p => p.pago))}</strong><br>Falta cobrar: <strong>${brl(soma(p => !p.pago))}</strong></p>`;

  const f = $('filtro').value;
  const faltaNo = p => p.itens.reduce((s, i) => s + i.qtd - pronto(p, i), 0);
  const mostra = p => !f ? p.etapa !== 'Apagado' : f === 'cobrar' ? !p.pago && conta(p) : f === 'fila' ? naFila(p) && faltaNo(p) > 0 : f === 'espera' ? p.espera && p.etapa !== 'Apagado' : p.etapa === f;
  const lista = pedidos.filter(mostra);
  // Fila: mais antigo primeiro, igual à ordem em que a fornada distribui; o resto, mais novo primeiro
  $('lista').innerHTML = (f === 'fila' ? lista : lista.reverse()).map((p, n) => {
    const id = esc(p.id);
    const prontos = Object.values(p.prontos).some(n => n > 0);
    return `
    <div class="card">
      <div class="linha"><strong>${f === 'fila' ? `${n + 1}º · ` : ''}${id} · ${esc(p.nome)}</strong><span>${brl(p.total)}</span></div>
      ${f === 'fila' ? `<div>Falta: ${p.itens.filter(i => i.qtd > pronto(p, i)).map(i => `${i.qtd - pronto(p, i)}× ${nomeItem(i.id, i.tamanho)}`).join(', ')}</div>` : ''}
      <div class="muted">${new Date(p.criadoEm).toLocaleString('pt-BR')}</div>
      <div><strong>${esc(p.etapa)}</strong> · ${p.pago ? 'Pago' : 'Não pago'}${p.espera ? ' · <strong class="espera">⏸ Na espera</strong>' : ''}</div>
      <div>${itensHtml(p)}</div>
      ${p.obs ? `<div class="muted">Obs: ${esc(p.obs)}</div>` : ''}
      <div class="acoes">${p.etapa === 'Apagado' ? `
        <button data-id="${id}" data-acao="status" data-v="Na fila">Restaurar</button>` : `
        <button data-id="${id}" data-acao="pago" data-v="${!p.pago}" class="${p.pago ? 'on' : ''}" aria-pressed="${p.pago}">${p.pago ? 'Pago' : 'Não pago'}</button>
        ${ativo(p) ? `<button data-id="${id}" data-acao="espera" data-v="${!p.espera}" class="${p.espera ? 'on-espera' : ''}" aria-pressed="${!!p.espera}">${p.espera ? 'Tirar da espera' : 'Pôr na espera'}</button>
        <button data-id="${id}" data-acao="status" data-v="Entregue">Entregue</button>
        <button data-id="${id}" data-acao="status" data-v="Cancelado">Cancelar</button>` : `<button data-id="${id}" data-acao="status" data-v="Na fila">Reabrir</button>`}
        ${prontos && ativo(p) ? `<button data-id="${id}" data-acao="desfazer">Desfazer prontos</button>` : ''}
        ${whats(p)}
        <button data-id="${id}" data-acao="status" data-v="Apagado">Apagar</button>`}
      </div>
    </div>`;
  }).join('') || '<p class="muted">Nenhum pedido.</p>';
}

const confirmar = {
  Cancelado: 'Cancelar este pedido? Se ele tinha panetones prontos, registre-os de novo em "Saiu da fornada" para irem a outro pedido.',
  desfazer: 'Desfazer os prontos deste pedido? Ele volta para a fila.',
  Apagado: 'Apagar este pedido? Ele some da lista e dos totais. Dá para restaurar no filtro "Apagados".',
  cancelarFornada: 'Cancelar esta fornada? Os panetones dela saem dos pedidos que os receberam, e esses pedidos voltam para a fila.'
};

$('painel').onclick = async e => {
  const b = e.target.closest('button[data-acao]');
  if (!b) return;
  const { id, acao, v, lote } = b.dataset;
  const pergunta = confirmar[acao === 'status' ? v : acao];
  if (pergunta && !confirm(pergunta)) return;
  b.disabled = true;
  const dados = acao === 'pago' ? { pago: v === 'true' } : acao === 'espera' ? { espera: v === 'true' } : acao === 'status' ? { status: v } : acao === 'cancelarFornada' ? { lote } : {};
  const r = await api({ acao, id, ...dados }).catch(err => ({ erro: err.message }));
  if (r.erro) { $('erro').textContent = 'Erro: ' + r.erro; b.disabled = false; return; }
  carregar();
};

$('fItens').innerHTML = '<tr><th></th><th>500 g</th><th>250 g</th></tr>' + CONFIG.produtos.map(p => `<tr><td>${p.nome}</td>` +
  ['500g', '250g'].map(t => `<td><input type="number" min="0" step="1" inputmode="numeric" data-id="${p.id}" data-tamanho="${t}" aria-label="${p.nome} ${t.replace('g', ' g')}"></td>`).join('') + '</tr>').join('');

// Registra item por item com a mesma ação do script; cada item já distribuído fica gravado mesmo se um seguinte falhar
$('fornada').onsubmit = async e => {
  e.preventDefault();
  const campos = [...$('fItens').querySelectorAll('input')].filter(c => c.value !== '' && Number(c.value) !== 0);
  if (!campos.length) return $('fResultado').innerHTML = '<p class="erro">Preencha a quantidade de pelo menos um item.</p>';
  if (campos.some(c => !Number.isInteger(Number(c.value)) || Number(c.value) < 0)) return $('fResultado').innerHTML = '<p class="erro">Use só números inteiros.</p>';
  $('fEnviar').disabled = true;
  $('fResultado').textContent = 'Registrando…';
  let html = '';
  const lote = new Date().toISOString(); // agrupa os itens desta fornada
  for (const c of campos) {
    const item = { id: c.dataset.id, tamanho: c.dataset.tamanho, qtd: Number(c.value) };
    const r = await api({ acao: 'fornada', lote, ...item }).catch(err => ({ erro: err.message }));
    if (r.erro) { html += `<p class="erro">Erro em ${nomeItem(item.id, item.tamanho)}: ${esc(r.erro)}. Os itens acima foram registrados; confira e tente de novo só os que faltaram.</p>`; break; }
    c.value = '';
    html += `<p><strong>${item.qtd}× ${nomeItem(item.id, item.tamanho)}</strong></p>` +
      r.destinos.map(d => `<div class="linha"><span>→ ${esc(d.id)} · ${esc(d.nome)}</span><strong>${d.qtd}</strong></div>`).join('') +
      (r.sobra ? `<p class="muted">Sobrou ${r.sobra}: nenhum pedido esperando.</p>` : '');
  }
  $('fEnviar').disabled = false;
  $('fResultado').innerHTML = html;
  carregar();
};

function sair() {
  localStorage.removeItem('token');
  pedidos = [];
  $('painel').hidden = true;
  $('login').hidden = false;
}

$('login').onsubmit = e => { e.preventDefault(); localStorage.setItem('token', $('senha').value); carregar(); };
$('sair').onclick = sair;
$('atualizar').onclick = carregar;
$('filtro').onchange = render;

localStorage.getItem('token') ? carregar() : sair();
</script>
</body>
</html>
